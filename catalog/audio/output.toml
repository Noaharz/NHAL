id = "audio.output"
version = 1
status = "experimental"
summary = "Ausgabe auf das Standard-Audiogerät (Float-Samples per Render-Funktion)"
requires = []

[platforms.macos]
policy = "native"
sources = ["backends/macos/audio/output.c"]
link = ["-Wl,-framework,AudioToolbox", "-Wl,-framework,CoreAudio"]
note = "CoreAudio (Default-Output-Unit), render() auf dem Echtzeit-Thread"

[platforms.windows]
policy = "planned"
note = "WASAPI-Backend folgt"

[platforms.linux]
policy = "planned"
note = "PipeWire/ALSA-Backend folgt"

[platforms.xernel]
policy = "planned"
note = "braucht einen Audio-Treiber in Xernel"

[platforms.web]
policy = "native"
sources = ["backends/web/audio/output.c"]
note = "Web Audio (ScriptProcessorNode), render() im Hauptthread; startet erst nach einer Nutzeraktion"

[platforms.console]
policy = "external"
