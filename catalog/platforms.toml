# Zielplattformen von NHAL. Der Schlüssel ist die Plattform-ID. Sie ist
# zugleich das Flag des Werkzeugs (--macos, --xernel, …) und der Name der
# Tabelle [platforms.<id>] in jedem Feature.
#
# Felder:
#   name          Anzeigename
#   freestanding  ohne libc bauen (-ffreestanding)
#   allocator     Quellen des Standard-Allocators (ohne Angabe: libc-Allocator,
#                 bei freestanding keiner – dann muss der Aufrufer einen mitgeben)
#   toolchain     CMake-Toolchain-Datei für den Cross-Build
#   wrapper       Programm, das cmake umhüllt (z. B. emcmake)
#   external      Backends liegen außerhalb dieses Repos
#   note          Hinweis für die Plattform-Matrix

[macos]
name = "macOS (Apple Silicon)"

[windows]
name = "Windows"

[linux]
name = "Linux"

[xernel]
name = "Xernel"
allocator = ["backends/xernel/allocator.c"]
toolchain = "cmake/toolchains/xernel-x86_64.cmake"
note = "Eigenständiges Betriebssystem (Mikrokernel, x86_64) mit eigener C-Bibliothek xlibc. Gebaut wird gegen den Xernel-Workspace in XERNEL_ROOT."

[web]
name = "Web (WebAssembly)"
wrapper = "emcmake"
note = "Gebaut mit Emscripten. Im Browser gibt es keinen direkten Zugriff auf Dateisystem oder Sockets des Betriebssystems; fs.* läuft über das virtuelle Dateisystem bzw. HTTP."

[console]
name = "Konsolen"
external = true
note = "Konsolen-SDKs stehen unter NDA. Backends liegen in privaten Repos lizenzierter Entwickler; hier gibt es nur die Schnittstelle."
