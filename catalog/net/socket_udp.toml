id = "net.socket_udp"
version = 1
status = "experimental"
summary = "UDP-Sockets, nicht blockierend"
requires = []

[platforms.macos]
policy = "native"
sources = ["backends/posix/net/socket_udp.c"]

[platforms.windows]
policy = "planned"
note = "Winsock-Backend folgt"

[platforms.linux]
policy = "native"
sources = ["backends/posix/net/socket_udp.c"]

[platforms.xernel]
policy = "planned"
note = "braucht Sockets in xlibc (Netzstack-Server von Xernel)"

[platforms.web]
policy = "reject"
note = "Browser erlauben keine UDP-Sockets (WebTransport wäre ein eigenes Feature)"

[platforms.console]
policy = "external"
